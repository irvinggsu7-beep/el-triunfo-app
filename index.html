<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Triunfo - Inmobiliaria Estudiantil</title>

  <!-- Favicon e Icono de Aplicación Móvil para Celulares (Android & iPhone) -->
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="El Triunfo">
  <meta name="application-name" content="El Triunfo">

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Fuentes Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SheetJS para Exportación a Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <!-- Supabase JS CDN (Opcional para Nube) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN Y CONMUTADOR DE ROLES -->
  <nav class="navbar">
    <div class="brand">
      <img src="img/logo.png" alt="Logo El Triunfo" style="width:45px; height:45px; border-radius:10px; object-fit:cover; border:2px solid rgba(255,255,255,0.2);">
      <div class="brand-title">
        <h1>El Triunfo</h1>
        <p>Inmobiliaria Estudiantil - 22 Dptos & 10 Casas</p>
      </div>
    </div>

    <div class="role-switcher-container">
      <button class="role-btn active" data-role="admin">
        <i data-lucide="shield"></i> Administrador
      </button>
      <button class="role-btn" data-role="dueno">
        <i data-lucide="crown"></i> Dueño
      </button>
      <button class="role-btn" data-role="sol">
        <i data-lucide="user-check"></i> SOL
      </button>
    </div>
  </nav>

  <!-- CONTENEDOR DINÁMICO DE LA APLICACIÓN -->
  <main id="main-content">
    <div style="display:flex; justify-content:center; align-items:center; min-height:60vh; font-size:1.2rem; color:var(--text-muted);">
      Cargando interfaz de El Triunfo...
    </div>
  </main>

  <!-- SCRIPTS ORDENADOS DE FORMA SECUENCIAL DIRECTA (COMPATIBLES CON DOBLE CLIC LOCAL) -->
  <script src="js/initial-data.js"></script>
  <script src="js/status-engine.js"></script>
  <script src="js/excel-export.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
